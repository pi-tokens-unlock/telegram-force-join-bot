services:
  - type: web
    name: telegram-force-join-bot # 👈 আপনার সার্ভিসের নাম
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      # ⚠️ এই ভেরিয়েবলগুলো অবশ্যই আপনার Render ড্যাশবোর্ডে বা এই ফাইলে যোগ করতে হবে।
      # আপনার Render URL হবে যেমন: https://telegram-force-join-bot.onrender.com/
      - key: WEBHOOK_URL
        value: "https://আপনার-সার্ভিসের-নাম.onrender.com/" # 👈 এখানে আপনার সঠিক URL দিন
      - key: BOT_TOKEN
        value: "আপনার_বটের_আসল_টোকেন" # 👈 আপনার বটের টোকেন দিন
      # আপনি যদি main.py-তে পোর্ট 5000 ব্যবহার করে থাকেন
      - key: PORT
        value: "5000" 
    # Render-কে নিষ্ক্রিয়তার কারণে বন্ধ হওয়া থেকে বাঁচাতে এটি যোগ করুন (ঐচ্ছিক)
    autoDeploy: true
